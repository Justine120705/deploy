partment Head</text><line x1="167" y1="714" x2="235" y2="714" stroke="#333" stroke-width="1.6"/><line x1="235" y1="642" x2="235" y2="798" stroke="#333" stroke-width="1.6"/><line x1="235" y1="642" x2="445" y2="642" stroke="#333" stroke-width="1.6"/><line x1="235" y1="720" x2="445" y2="720" stroke="#333" stroke-width="1.6"/><line x1="235" y1="798" x2="445" y2="798" stroke="#333" stroke-width="1.6"/><line x1="83" y1="714" x2="24" y2="714" stroke="#c8691e" stroke-width="1.5"/><ellipse cx="640" cy="916" rx="195" ry="34" fill="#ebe8ff" stroke="#7a6bc7" stroke-width="1.5"/><text x="640" y="921" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">View Financial Balances</text><ellipse cx="640" cy="994" rx="195" ry="34" fill="#ebe8ff" stroke="#7a6bc7" stroke-width="1.5"/><text x="640" y="990" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Log Payments and Tag</text><text x="640" y="1008" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Charges Cleared</text><circle cx="125" cy="913" r="20" fill="white" stroke="#222" stroke-width="2"/><line x1="125" y1="933" x2="125" y2="983" stroke="#222" stroke-width="2"/><line x1="83" y1="949" x2="167" y2="949" stroke="#222" stroke-width="2"/><line x1="125" y1="983" x2="97" y2="1021" stroke="#222" stroke-width="2"/><line x1="125" y1="983" x2="153" y2="1021" stroke="#222" stroke-width="2"/><text x="125" y="1047" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Cashier</text><line x1="167" y1="949" x2="235" y2="949" stroke="#333" stroke-width="1.6"/><line x1="235" y1="916" x2="235" y2="994" stroke="#333" stroke-width="1.6"/><line x1="235" y1="916" x2="445" y2="916" stroke="#333" stroke-width="1.6"/><line x1="235" y1="994" x2="445" y2="994" stroke="#333" stroke-width="1.6"/><line x1="83" y1="949" x2="24" y2="949" stroke="#c8691e" stroke-width="1.5"/><ellipse cx="640" cy="1112" rx="195" ry="34" fill="#ebe8ff" stroke="#7a6bc7" stroke-width="1.5"/><text x="640" y="1108" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Review Enrollments</text><text x="640" y="1126" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">(Approve or Reject)</text><ellipse cx="640" cy="1190" rx="195" ry="34" fill="#ebe8ff" stroke="#7a6bc7" stroke-width="1.5"/><text x="640" y="1195" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Encode and Update Grades</text><ellipse cx="640" cy="1268" rx="195" ry="34" fill="#ebe8ff" stroke="#7a6bc7" stroke-width="1.5"/><text x="640" y="1273" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Process Document Requests</text><ellipse cx="640" cy="1346" rx="195" ry="34" fill="#ebe8ff" stroke="#7a6bc7" stroke-width="1.5"/><text x="640" y="1351" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Issue Final Clearance</text><circle cx="125" cy="1187" r="20" fill="white" stroke="#222" stroke-width="2"/><line x1="125" y1="1207" x2="125" y2="1257" stroke="#222" stroke-width="2"/><line x1="83" y1="1223" x2="167" y2="1223" stroke="#222" stroke-width="2"/><line x1="125" y1="1257" x2="97" y2="1295" stroke="#222" stroke-width="2"/><line x1="125" y1="1257" x2="153" y2="1295" stroke="#222" stroke-width="2"/><text x="125" y="1321" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Registrar</text><line x1="167" y1="1223" x2="235" y2="1223" stroke="#333" stroke-width="1.6"/><line x1="235" y1="1112" x2="235" y2="1346" stroke="#333" stroke-width="1.6"/><line x1="235" y1="1112" x2="445" y2="1112" stroke="#333" stroke-width="1.6"/><line x1="235" y1="1190" x2="445" y2="1190" stroke="#333" stroke-width="1.6"/><line x1="235" y1="1268" x2="445" y2="1268" stroke="#333" stroke-width="1.6"/><line x1="235" y1="1346" x2="445" y2="1346" stroke="#333" stroke-width="1.6"/><line x1="83" y1="1223" x2="24" y2="1223" stroke="#c8691e" stroke-width="1.5"/><ellipse cx="1065" cy="798" rx="170" ry="34" fill="#e1f3e8" stroke="#3a8a5a" stroke-width="1.5"/><text x="1065" y="803" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Check Active Holds</text><line x1="835" y1="798" x2="887" y2="798" stroke="#5a4aa5" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="884,792 895,798 884,804" fill="none" stroke="#5a4aa5" stroke-width="1.6"/><text x="865.0" y="789" font-size="11" text-anchor="middle" fill="#5a4aa5" font-weight="normal">«include»</text><ellipse cx="1065" cy="994" rx="170" ry="34" fill="#e1f3e8" stroke="#3a8a5a" stroke-width="1.5"/><text x="1065" y="990" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Update Finance Clearance</text><text x="1065" y="1008" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">(automatic, REQ-CSH-03)</text><line x1="835" y1="994" x2="887" y2="994" stroke="#5a4aa5" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="884,988 895,994 884,1000" fill="none" stroke="#5a4aa5" stroke-width="1.6"/><text x="865.0" y="985" font-size="11" text-anchor="middle" fill="#5a4aa5" font-weight="normal">«include»</text><ellipse cx="1065" cy="1346" rx="170" ry="34" fill="#e1f3e8" stroke="#3a8a5a" stroke-width="1.5"/><text x="1065" y="1342" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Verify All Departments</text><text x="1065" y="1360" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">and Finance Cleared</text><line x1="835" y1="1346" x2="887" y2="1346" stroke="#5a4aa5" stroke-width="1.6" stroke-dasharray="6 4"/><polyline points="884,1340 895,1346 884,1352" fill="none" stroke="#5a4aa5" stroke-width="1.6"/><text x="865.0" y="1337" font-size="11" text-anchor="middle" fill="#5a4aa5" font-weight="normal">«include»</text><ellipse cx="1065" cy="1268" rx="170" ry="34" fill="#e1f3e8" stroke="#3a8a5a" stroke-width="1.5"/><text x="1065" y="1273" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Reject Document Request</text><line x1="895" y1="1268" x2="843" y2="1268" stroke="#