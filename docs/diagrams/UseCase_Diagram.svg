<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1740" viewBox="0 0 2000 1740" font-family="Arial, Helvetica, sans-serif"><rect width="2000" height="1740" fill="white"/><text x="60" y="52" font-size="32" text-anchor="start" fill="#111" font-weight="bold">Use Case Diagram</text><text x="60" y="82" font-size="15" text-anchor="start" fill="#555" font-weight="normal">Centralized Student Portal and Automated Clearance System. Solid line = association. Dashed arrow = «include» (base to included) or «extend» (extension to base).</text><rect x="275" y="150" width="1505" height="1560" fill="#ffffe5" stroke="#a8ab72" stroke-width="2"/><text x="303" y="200" font-size="23" text-anchor="start" fill="#222" font-weight="bold">PnC Centralized Student Portal and Clearance System</text><ellipse cx="640" cy="290" rx="195" ry="34" fill="#ebe8ff" stroke="#7a6bc7" stroke-width="1.5"/><text x="640" y="286" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Create, Update and</text><text x="640" y="304" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Deactivate Accounts</text><ellipse cx="640" cy="368" rx="195" ry="34" fill="#ebe8ff" stroke="#7a6bc7" stroke-width="1.5"/><text x="640" y="373" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Assign Roles (RBAC)</text><ellipse cx="640" cy="446" rx="195" ry="34" fill="#ebe8ff" stroke="#7a6bc7" stroke-width="1.5"/><text x="640" y="451" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Maintain Academic Catalog *</text><ellipse cx="640" cy="524" rx="195" ry="34" fill="#ebe8ff" stroke="#7a6bc7" stroke-width="1.5"/><text x="640" y="529" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">View Audit Logs</text><circle cx="125" cy="365" r="20" fill="white" stroke="#222" stroke-width="2"/><line x1="125" y1="385" x2="125" y2="435" stroke="#222" stroke-width="2"/><line x1="83" y1="401" x2="167" y2="401" stroke="#222" stroke-width="2"/><line x1="12