iddle" fill="#222" font-weight="normal">Track Document Request</text><circle cx="1890" cy="648" r="20" fill="white" stroke="#222" stroke-width="2"/><line x1="1890" y1="668" x2="1890" y2="718" stroke="#222" stroke-width="2"/><line x1="1848" y1="684" x2="1932" y2="684" stroke="#222" stroke-width="2"/><line x1="1890" y1="718" x2="1862" y2="756" stroke="#222" stroke-width="2"/><line x1="1890" y1="718" x2="1918" y2="756" stroke="#222" stroke-width="2"/><text x="1890" y="782" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Student</text><line x1="1932" y1="684" x2="1745" y2="684" stroke="#333" stroke-width="1.6"/><line x1="1745" y1="330" x2="1745" y2="1050" stroke="#333" stroke-width="1.6"/><line x1="1745" y1="330" x2="1695" y2="330" stroke="#333" stroke-width="1.6"/><line x1="1745" y1="450" x2="1695" y2="450" stroke="#333" stroke-width="1.6"/><line x1="1745" y1="570" x2="1695" y2="570" stroke="#333" stroke-width="1.6"/><line x1="1745" y1="690" x2="1695" y2="690" stroke="#333" stroke-width="1.6"/><line x1="1745" y1="810" x2="1695" y2="810" stroke="#333" stroke-width="1.6"/><line x1="1745" y1="930" x2="1695" y2="930" stroke="#333" stroke-width="1.6"/><line x1="1745" y1="1050" x2="1695" y2="1050" stroke="#333" stroke-width="1.6"/><line x1="1932" y1="684" x2="1975" y2="684" stroke="#c8691e" stroke-width="1.5"/><line x1="1975" y1="684" x2="1975" y2="1560" stroke="#c8691e" stroke-width="1.5"/><line x1="1975" y1="1560" x2="1250" y2="1560" stroke="#c8691e" stroke-width="1.5"/><ellipse cx="1030" cy="1560" rx="220" ry="38" fill="#fde3d3" stroke="#c8691e" stroke-width="1.5"/><text x="1030" y="1565" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">Log in (Supabase Auth)</text><text x="1030" y="1626" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">All five actors log in (orange lines). Every other use case requires a logged-in user.</text><text x="303" y="1668" font-size="13" text-anchor="start" fill="#666" font-weight="normal">* Maintain Academic Catalog (departments, programs, terms, subjects, sections) is requirement REQ-ADM-04 in the SRS.</text><text x="303" y="1690" font-size="13" text-anchor="start" fill="#666" font-weight="normal">  Request Clearance is REQ-STU-06. Both are also shown in the Level 1 DFD.</text></svg>